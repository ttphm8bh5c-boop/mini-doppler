<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>胎兒多普勒 CPR 計算器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="ios-app-body">

  <div class="app-container">
    <!-- 頂部標題列 (iOS Navigation Bar) -->
    <header class="ios-nav-header">
      <h1 class="nav-title">胎兒 CPR 計算器</h1>
      <span class="nav-subtitle">Fetal Cerebroplacental Ratio</span>
    </header>

    <!-- 1. 核心結果雙輸出卡片 (CPR 數值 ＆ 百分位數 %) -->
    <section class="result-card">
      <div class="result-col">
        <span class="result-label">CPR 數值</span>
        <div class="result-value" id="res-cpr-val">2.03</div>
        <span class="result-formula">MCA PI / UmA PI</span>
      </div>

      <div class="result-divider"></div>

      <div class="result-col">
        <span class="result-label">百分位數 (參考值)</span>
        <div class="result-value" id="res-centile-val">72.8%</div>
        <span id="res-status-badge" class="status-badge badge-normal">常態區間 (≥ 5th)</span>
      </div>
    </section>

    <!-- 2. 懷孕週數轉輪選擇器 (iOS Picker Wheel) -->
    <section class="ios-card wheel-card">
      <div class="card-header">
        <span class="card-title">懷孕週數 (Gestational Age)</span>
        <span class="card-highlight" id="ga-selected-display">28 週 4 天</span>
      </div>

      <div class="ios-picker-wrapper">
        <!-- 中心選取光帶 -->
        <div class="picker-selection-indicator"></div>
        <!-- 漸層深度遮罩 (營造滾輪立體景深) -->
        <div class="picker-fade-mask"></div>

        <!-- 週數滾輪 (20 ~ 42 週) -->
        <div class="picker-column" id="picker-col-weeks">
          <div class="picker-wheel" id="wheel-weeks">
            <!-- 由 JavaScript 自動生成 -->
          </div>
        </div>

        <div class="picker-divider">＋</div>

        <!-- 天數滾輪 (0 ~ 6 天) -->
        <div class="picker-column" id="picker-col-days">
          <div class="picker-wheel" id="wheel-days">
            <!-- 由 JavaScript 自動生成 -->
          </div>
        </div>
      </div>
    </section>

    <!-- 3. MCA PI 與 UmA PI 數字鍵盤輸入群組 -->
    <section class="ios-card inputs-card">
      <div class="doppler-input-row">
        <div class="doppler-label-wrap">
          <label class="doppler-title" for="input-mca">大腦中動脈 MCA PI</label>
          <span class="doppler-subtitle">Middle Cerebral Artery</span>
        </div>
        <div class="input-field-box">
          <input type="text" inputmode="decimal" id="input-mca" class="ios-number-input" value="1.79" placeholder="1.79" autocomplete="off" />
        </div>
      </div>

      <div class="row-separator"></div>

      <div class="doppler-input-row">
        <div class="doppler-label-wrap">
          <label class="doppler-title" for="input-uma">臍動脈 UmA PI</label>
          <span class="doppler-subtitle">Umbilical Artery</span>
        </div>
        <div class="input-field-box">
          <input type="text" inputmode="decimal" id="input-uma" class="ios-number-input" value="0.88" placeholder="0.88" autocomplete="off" />
        </div>
      </div>
    </section>

    <!-- 臨床指引免責與文獻依據 -->
    <footer class="app-footer">
      <p class="citation-text">參考文獻：Fetal Medicine Foundation 2019 (Ciobanu et al.)</p>
      <p class="disclaimer-text">⚠️ 依據 ISUOG 2020 指引：本工具百分位數僅供產科臨床參考，請結合胎兒生長指標綜合評估。</p>
    </footer>
  </div>

  <!-- iOS 鍵盤工具列 (點擊輸入時浮出「完成」按鈕) -->
  <div id="ios-keyboard-bar" class="keyboard-toolbar hidden">
    <span class="kb-label" id="kb-field-label">輸入數值</span>
    <button type="button" id="btn-kb-done" class="kb-done-btn">完成 ✕</button>
  </div>

  <script src="app.bundle.js"></script>
</body>
</html>
