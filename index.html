<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>胎兒 CPR 縱向追蹤計算器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="mode-portrait">

  <!-- =========================================================================
       模式一：直屏模式 (Portrait Mode) - 嚴格病患隔離、單手輸入與歷程清單
       ========================================================================= -->
  <div id="container-portrait" class="view-container portrait-view">
    <!-- 頂部導航列 -->
    <header class="ios-nav-bar">
      <div class="nav-content">
        <div>
          <h1 class="nav-title">CPR 縱向追蹤</h1>
          <span class="nav-patient-indicator" id="nav-patient-indicator">新病患（獨立檢測）</span>
        </div>
        <button type="button" id="btn-toggle-to-chart" class="nav-chart-btn" title="查看全螢幕多點趨勢圖表">
          📊 全幅趨勢圖
        </button>
      </div>
    </header>

    <main class="portrait-body">
      <!-- 1. 病歷號管理與切換卡片 (嚴格獨立病歷檔案) -->
      <section class="ios-card patient-card">
        <div class="patient-row">
          <label class="patient-label" for="input-patient-mrn">病歷號</label>
          <div class="patient-input-wrap">
            <input type="text" id="input-patient-mrn" value="" placeholder="請輸入病歷號 (例如 A1234)" class="mrn-input" autocomplete="off" />
            <button type="button" id="btn-new-patient" class="btn-new-patient-action" title="建立新病患 / 清空欄位">
              ➕ 新病人
            </button>
          </div>
        </div>

        <div class="patient-switch-row">
          <select id="select-recent-patients" class="recent-select-full" title="載入既有病患歷史檔案">
            <option value="">📂 載入既有病歷檔案...</option>
          </select>
        </div>

        <div class="patient-time-row">
          <span class="time-label">量測時間（自動鍵入）：</span>
          <span id="display-auto-time" class="time-value">2026-09-03 08:46</span>
        </div>
      </section>

      <!-- 2. 當次 CPR 核心結果大卡片 (嚴格限「同病患」比對) -->
      <section class="ios-card result-hero-card">
        <div class="hero-cpr-header">
          <span class="hero-label">本次 CPR 數值</span>
          <span class="hero-label">百分位數</span>
        </div>

        <div class="hero-numbers-row">
          <div class="hero-cpr-val" id="display-cpr-num">2.03</div>
          <div class="hero-centile-val" id="display-cpr-centile">80.5%</div>
        </div>

        <div class="hero-footer-row">
          <span id="display-cpr-status-badge" class="ios-badge badge-normal">
            ✓ 正常 (≥ 第 5 百分位)
          </span>
          <!-- 嚴格同病患歷史比對徽章 -->
          <span id="display-trend-badge" class="trend-badge badge-stable">
            新病患（無前次紀錄）
          </span>
        </div>
      </section>

      <!-- 3. 單手 3 欄輸入格 (44pt+ 觸控高度) -->
      <section class="ios-card inputs-card">
        <!-- 懷孕週數 -->
        <div class="ios-list-row">
          <label class="row-label">懷孕週數</label>
          <div class="ga-input-cluster">
            <input type="number" id="input-ga-weeks" value="28" min="20" max="42" step="1" inputmode="numeric" class="ga-num-input" />
            <span class="ga-unit">週</span>
            <span class="ga-plus">+</span>
            <input type="number" id="input-ga-days" value="4" min="0" max="6" step="1" inputmode="numeric" class="ga-num-input" />
            <span class="ga-unit">天</span>
          </div>
        </div>

        <!-- MCA PI -->
        <div class="ios-list-row">
          <label class="row-label" for="input-mca-pi">MCA PI</label>
          <input type="number" id="input-mca-pi" value="1.79" step="0.01" min="0.1" max="4.0" inputmode="decimal" class="row-single-input" placeholder="例如 1.79" />
        </div>

        <!-- UmA PI -->
        <div class="ios-list-row last-row">
          <label class="row-label" for="input-uma-pi">UmA PI</label>
          <input type="number" id="input-uma-pi" value="0.88" step="0.01" min="0.1" max="4.0" inputmode="decimal" class="row-single-input" placeholder="例如 0.88" />
        </div>
      </section>

      <!-- 4. 儲存按鈕組 -->
      <div class="action-btn-group">
        <button type="button" id="btn-save-measurement" class="btn-save-record">
          💾 儲存本次量測至病歷
        </button>
      </div>

      <!-- 5. 該病患歷史追蹤歷程 (Timeline History) -->
      <section class="ios-card history-card" id="card-history">
        <div class="history-header">
          <span class="history-title" id="history-header-title">📅 追蹤歷程 (0 次測量)</span>
          <span class="history-sub">限同一病患縱向比對</span>
        </div>
        <div id="history-list-mount" class="history-list">
          <div class="history-empty">目前為新病患，無歷史前次紀錄。</div>
        </div>
      </section>
    </main>
  </div>


  <!-- =========================================================================
       模式二：橫屏模式 (Landscape Mode) - 全幅多時點 CPR 趨勢折線圖
       ========================================================================= -->
  <div id="container-landscape" class="view-container landscape-view">
    <!-- 橫屏頂部控制列 -->
    <header class="landscape-header">
      <div class="ls-patient-badge">
        <span class="ls-dot-indicator" id="ls-status-dot"></span>
        <span id="ls-patient-summary">新病患 · 單次實測落點</span>
      </div>

      <div class="ls-trend-summary" id="ls-trend-text">
        單次測量模式
      </div>

      <button type="button" id="btn-back-to-input" class="ls-back-btn">
        ↺ 返回輸入
      </button>
    </header>

    <!-- 橫屏全螢幕多時點趨勢圖表畫布 -->
    <div id="landscape-chart-mount" class="landscape-chart-container"></div>
  </div>


  <!-- =========================================================================
       iOS 鍵盤專屬工具列 (Keyboard Accessory Toolbar)
       ========================================================================= -->
  <div id="ios-kb-toolbar" class="ios-kb-toolbar hidden">
    <div class="kb-toolbar-left">
      <span class="kb-current-label" id="kb-current-label">輸入中...</span>
    </div>
    <div class="kb-toolbar-right">
      <button type="button" id="btn-kb-next" class="kb-action-btn">下一格 ➔</button>
      <button type="button" id="btn-kb-done" class="kb-done-btn">完成 ✕</button>
    </div>
  </div>


  <!-- 內建純原生資料庫與演算法腳本 (嚴格病患獨立隔離) -->
  <script>
    (function () {
      var STORAGE_KEY = 'fetal_doppler_patients_v1';

      var DB = {
        getAll: function () {
          try {
            var data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : {};
          } catch (e) {
            return {};
          }
        },
        getRecords: function (mrn) {
          if (!mrn || !mrn.trim()) return [];
          var all = this.getAll();
          var key = mrn.trim().toUpperCase();
          var p = all[key];
          if (!p || !p.records) return [];
          return p.records.slice().sort(function (a, b) { return a.gaDecimal - b.gaDecimal; });
        },
        save: function (mrn, entry) {
          if (!mrn || !mrn.trim()) return [];
          var key = mrn.trim().toUpperCase();
          var all = this.getAll();
          if (!all[key]) {
            all[key] = { mrn: key, createdAt: new Date().toISOString(), records: [] };
          }
          all[key].lastUpdated = new Date().toISOString();

          var now = new Date();
          var timestamp = entry.timestamp ||
            (now.getFullYear() + '-' +
            String(now.getMonth() + 1).padStart(2, '0') + '-' +
            String(now.getDate()).padStart(2, '0') + ' ' +
            String(now.getHours()).padStart(2, '0') + ':' +
            String(now.getMinutes()).padStart(2, '0'));

          var newRec = {
            id: 'rec_' + Date.now(),
            timestamp: timestamp,
            weeks: entry.weeks,
            days: entry.days,
            gaDecimal: entry.gaDecimal,
            mcaPI: entry.mcaPI,
            umaPI: entry.umaPI,
            cpr: entry.cpr,
            centile: entry.centile,
            isAbnormal: entry.isAbnormal
          };

          all[key].records.push(newRec);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
          return this.getRecords(key);
        },
        delete: function (mrn, recId) {
          if (!mrn) return [];
          var key = mrn.trim().toUpperCase();
          var all = this.getAll();
          if (all[key] && all[key].records) {
            all[key].records = all[key].records.filter(function (r) { return r.id !== recId; });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
          }
          return this.getRecords(key);
        },
        listPatients: function () {
          var all = this.getAll();
          return Object.keys(all).map(function (k) {
            return { mrn: k, count: all[k].records ? all[k].records.length : 0 };
          });
        }
      };

      function normalCDF(z) {
        var t = 1.0 / (1.0 + 0.3275911 * Math.abs(z));
        var poly = ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t;
        var erf = (z >= 0 ? 1 : -1) * (1.0 - poly * Math.exp(-z * z));
        return 0.5 * (1.0 + erf);
      }

      function getFMFCPRReference(gaDays) {
        var logMedian = -0.1820 + (0.00392 * gaDays) - (0.00000854 * gaDays * gaDays);
        var median = Math.pow(10, logMedian);
        var sd = 0.0952 - (0.000251 * gaDays) + (0.00000085 * gaDays * gaDays);
        var z90 = 1.644853;
        var p5 = Math.pow(10, logMedian - (z90 * sd));
        var p95 = Math.pow(10, logMedian + (z90 * sd));
        return { median: median, sd: sd, p5: p5, p95: p95, logMedian: logMedian };
      }

      var currentCalc = {
        weeks: 28,
        days: 4,
        gaDecimal: 28.57,
        mcaPI: 1.79,
        umaPI: 0.88,
        cpr: 2.03,
        centile: 80.5,
        isAbnormal: false
      };

      var activeMRN = ''; // 預設為空，不預設綁定任何特定病患！

      function updateAutoTime() {
        var now = new Date();
        var str = now.getFullYear() + '-' +
          String(now.getMonth() + 1).padStart(2, '0') + '-' +
          String(now.getDate()).padStart(2, '0') + ' ' +
          String(now.getHours()).padStart(2, '0') + ':' +
          String(now.getMinutes()).padStart(2, '0');
        var el = document.getElementById('display-auto-time');
        if (el) el.textContent = str;
        return str;
      }

      function recalculate() {
        var mrnInput = document.getElementById('input-patient-mrn');
        activeMRN = mrnInput ? mrnInput.value.trim().toUpperCase() : '';

        var w = parseInt(document.getElementById('input-ga-weeks').value, 10);
        var d = parseInt(document.getElementById('input-ga-days').value, 10);
        var mca = parseFloat(document.getElementById('input-mca-pi').value);
        var uma = parseFloat(document.getElementById('input-uma-pi').value);

        if (isNaN(w) || w < 20 || w > 42) w = 28;
        if (isNaN(d) || d < 0 || d > 6) d = 0;
        if (isNaN(mca) || mca <= 0) mca = 1.0;
        if (isNaN(uma) || uma <= 0) uma = 1.0;

        var gaDays = (w * 7) + d;
        var gaDec = w + (d / 7);
        var cpr = mca / uma;

        var ref = getFMFCPRReference(gaDays);
        var z = (Math.log10(cpr) - ref.logMedian) / ref.sd;
        var centile = normalCDF(z) * 100.0;
        var isAbnormal = centile < 5.0;

        currentCalc.weeks = w;
        currentCalc.days = d;
        currentCalc.gaDecimal = gaDec;
        currentCalc.mcaPI = mca;
        currentCalc.umaPI = uma;
        currentCalc.cpr = cpr;
        currentCalc.centile = centile;
        currentCalc.isAbnormal = isAbnormal;

        document.getElementById('display-cpr-num').textContent = cpr.toFixed(2);
        var pText = centile < 1.0 ? '< 1%' : (centile > 99.0 ? '> 99%' : centile.toFixed(1) + '%');
        document.getElementById('display-cpr-centile').textContent = pText;

        var badge = document.getElementById('display-cpr-status-badge');
        if (isAbnormal) {
          badge.className = 'ios-badge badge-abnormal';
          badge.textContent = '⚠️ 異常 (< 第 5 百分位)';
        } else {
          badge.className = 'ios-badge badge-normal';
          badge.textContent = '✓ 正常 (≥ 第 5 百分位)';
        }

        // 更新病患狀態與歷史追蹤
        updatePatientStateAndTrend();
      }

      // =========================================================================
      // 核心：嚴格同病患隔離比較 (Strict Patient Isolation)
      // =========================================================================
      function updatePatientStateAndTrend() {
        var navIndicator = document.getElementById('nav-patient-indicator');
        var trendBadge = document.getElementById('display-trend-badge');
        var listMount = document.getElementById('history-list-mount');
        var historyTitle = document.getElementById('history-header-title');

        if (!activeMRN) {
          // 尚未輸入病歷號：獨立全新檢測，嚴禁跨病患比對！
          navIndicator.textContent = '未指定病歷號（獨立檢測）';
          navIndicator.className = 'nav-patient-indicator text-muted';
          trendBadge.className = 'trend-badge badge-stable';
          trendBadge.textContent = '新病患紀錄';
          historyTitle.textContent = '📅 追蹤歷程 (未建檔)';
          listMount.innerHTML = '<div class="history-empty">請輸入病歷號建立專屬檔案，或點「儲存」自動歸檔。</div>';
          return;
        }

        navIndicator.textContent = '現正檢視病歷號：[' + activeMRN + ']';
        navIndicator.className = 'nav-patient-indicator text-active';

        // 取得「僅屬於此病歷號」的歷史紀錄
        var records = DB.getRecords(activeMRN);
        historyTitle.textContent = '📅 [' + activeMRN + '] 追蹤歷程 (' + records.length + ' 次測量)';

        if (records.length === 0) {
          // 此病歷號為全新檔案，無歷史數據
          trendBadge.className = 'trend-badge badge-stable';
          trendBadge.textContent = '新病患（無前次紀錄）';
          listMount.innerHTML = '<div class="history-empty">病歷號 [' + activeMRN + '] 尚無歷史紀錄。點擊下方儲存為第 1 次測量。</div>';
        } else {
          // 此病歷號有前次紀錄：僅與「本病患自己的前次紀錄」比對！
          var lastRec = records[records.length - 1];
          var deltaP = currentCalc.centile - lastRec.centile;

          if (deltaP <= -25.0) {
            trendBadge.className = 'trend-badge badge-danger';
            trendBadge.textContent = '⚠️ 同病患前次(' + lastRec.weeks + 'w)比對：急降 ' + deltaP.toFixed(0) + '%';
          } else if (deltaP < -10.0) {
            trendBadge.className = 'trend-badge badge-warning';
            trendBadge.textContent = '📉 同病患前次(' + lastRec.weeks + 'w)比對：下降 ' + deltaP.toFixed(0) + '%';
          } else if (deltaP > 10.0) {
            trendBadge.className = 'trend-badge badge-up';
            trendBadge.textContent = '📈 同病患前次(' + lastRec.weeks + 'w)比對：上升 +' + deltaP.toFixed(0) + '%';
          } else {
            trendBadge.className = 'trend-badge badge-stable';
            trendBadge.textContent = '同病患維持平穩 (' + (deltaP >= 0 ? '+' : '') + deltaP.toFixed(0) + '%)';
          }

          // 渲染該病患的專屬歷史清單
          var html = '';
          var rev = records.slice().reverse();
          for (var i = 0; i < rev.length; i++) {
            var r = rev[i];
            var idx = records.length - i;
            var isAb = r.centile < 5.0;
            html += '<div class="history-item">' +
              '<div class="history-item-left">' +
                '<span class="history-badge ' + (isAb ? 'badge-abnormal' : 'badge-normal') + '">第 ' + idx + ' 次</span>' +
                '<span class="history-ga">' + r.weeks + '+' + r.days + ' 週 (' + r.gaDecimal.toFixed(1) + 'w)</span>' +
                '<span class="history-time">' + r.timestamp + '</span>' +
              '</div>' +
              '<div class="history-item-right">' +
                '<span class="history-cpr">CPR <b>' + r.cpr.toFixed(2) + '</b></span>' +
                '<span class="history-centile ' + (isAb ? 'text-rose' : 'text-emerald') + '">' + r.centile.toFixed(1) + '%</span>' +
                '<button type="button" class="btn-del-rec" data-id="' + r.id + '" title="刪除此筆">✕</button>' +
              '</div>' +
            '</div>';
          }
          listMount.innerHTML = html;

          var delBtns = listMount.querySelectorAll('.btn-del-rec');
          delBtns.forEach(function (btn) {
            btn.addEventListener('click', function (e) {
              e.stopPropagation();
              var rid = btn.dataset.id;
              if (confirm('確定要刪除病歷 [' + activeMRN + '] 的此筆紀錄嗎？')) {
                DB.delete(activeMRN, rid);
                recalculate();
                renderLandscapeChart();
              }
            });
          });
        }

        updateRecentPatientsDropdown();
      }

      function updateRecentPatientsDropdown() {
        var sel = document.getElementById('select-recent-patients');
        if (!sel) return;
        var patients = DB.listPatients();
        var current = sel.value;
        var opts = '<option value="">📂 載入既有病歷檔案 (' + patients.length + ' 位)...</option>';
        patients.forEach(function (p) {
          opts += '<option value="' + p.mrn + '">病歷: ' + p.mrn + ' (' + p.count + ' 次量測)</option>';
        });
        sel.innerHTML = opts;
        if (current) sel.value = current;
      }

      function startNewPatient() {
        document.getElementById('input-patient-mrn').value = '';
        document.getElementById('select-recent-patients').value = '';
        activeMRN = '';
        recalculate();
        document.getElementById('input-patient-mrn').focus();
      }

      // =========================================================================
      // 橫屏全螢幕趨勢折線圖 (Strict Single-Patient Trajectory)
      // =========================================================================
      function renderLandscapeChart(scrubGA) {
        var container = document.getElementById('landscape-chart-mount');
        if (!container) return;

        var rect = container.getBoundingClientRect();
        var width = Math.max(rect.width || 740, 640);
        var height = Math.max(rect.height || 380, 320);

        var padding = { top: 25, right: 40, bottom: 35, left: 45 };
        var plotW = width - padding.left - padding.right;
        var plotH = height - padding.top - padding.bottom;

        var minX = 20;
        var maxX = 42;
        var minY = 0.4;
        var maxY = 3.0;

        // 僅取得「當前這一位病患」的歷史紀錄，絕不混入其他病患！
        var savedRecords = activeMRN ? DB.getRecords(activeMRN) : [];
        var allPoints = savedRecords.slice();

        var hasCurrent = savedRecords.some(function (r) {
          return Math.abs(r.gaDecimal - currentCalc.gaDecimal) < 0.05 && Math.abs(r.cpr - currentCalc.cpr) < 0.02;
        });
        if (!hasCurrent) {
          allPoints.push({
            gaDecimal: currentCalc.gaDecimal,
            cpr: currentCalc.cpr,
            centile: currentCalc.centile,
            isAbnormal: currentCalc.isAbnormal,
            isCurrentPreview: true,
            weeks: currentCalc.weeks,
            days: currentCalc.days,
            timestamp: '本次測量'
          });
          allPoints.sort(function (a, b) { return a.gaDecimal - b.gaDecimal; });
        }

        allPoints.forEach(function (pt) {
          if (pt.cpr > maxY) maxY = Math.ceil(pt.cpr * 1.15 * 10) / 10;
        });

        function sx(x) { return padding.left + ((x - minX) / (maxX - minX)) * plotW; }
        function sy(y) { return padding.top + plotH - ((y - minY) / (maxY - minY)) * plotH; }
        function invX(px) { return minX + ((px - padding.left) / plotW) * (maxX - minX); }

        var refPoints = [];
        for (var ga = 20.0; ga <= 42.0; ga += 0.5) {
          var ref = getFMFCPRReference(ga * 7);
          refPoints.push({ ga: ga, p5: ref.p5, p50: ref.median, p95: ref.p95 });
        }

        var path50 = refPoints.map(function (d, i) { return (i === 0 ? 'M' : 'L') + ' ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p50).toFixed(1); }).join(' ');
        var path95 = refPoints.map(function (d, i) { return (i === 0 ? 'M' : 'L') + ' ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p95).toFixed(1); }).join(' ');
        var path5 = refPoints.map(function (d, i) { return (i === 0 ? 'M' : 'L') + ' ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p5).toFixed(1); }).join(' ');
        var forward95 = path95;
        var backward5 = refPoints.slice().reverse().map(function (d) { return 'L ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p5).toFixed(1); }).join(' ');
        var shadedBand = forward95 + ' ' + backward5 + ' Z';

        var gridX = '';
        for (var w = 20; w <= 42; w += 2) {
          var gx = sx(w);
          gridX += '<line x1="' + gx + '" y1="' + padding.top + '" x2="' + gx + '" y2="' + (padding.top + plotH) + '" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>' +
                   '<text x="' + gx + '" y="' + (padding.top + plotH + 18) + '" font-size="11" fill="#64748b" text-anchor="middle">' + w + 'w</text>';
        }

        var gridY = '';
        for (var yVal = 0.5; yVal <= maxY + 0.001; yVal += 0.5) {
          var gy = sy(yVal);
          gridY += '<line x1="' + padding.left + '" y1="' + gy + '" x2="' + (padding.left + plotW) + '" y2="' + gy + '" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>' +
                   '<text x="' + (padding.left - 8) + '" y="' + (gy + 4) + '" font-size="11" fill="#64748b" text-anchor="end">' + yVal.toFixed(1) + '</text>';
        }

        // 僅在「同一位病患」有 2 次以上紀錄時，才繪製趨勢折線！
        var trajectoryPath = '';
        var trajectoryGlow = '';
        var trajectoryMarkers = '';

        if (allPoints.length > 0) {
          if (allPoints.length >= 2 && activeMRN) {
            var pathCommands = allPoints.map(function (pt, idx) {
              var px = sx(pt.gaDecimal).toFixed(1);
              var py = sy(pt.cpr).toFixed(1);
              return (idx === 0 ? 'M' : 'L') + ' ' + px + ' ' + py;
            }).join(' ');

            trajectoryGlow = '<path d="' + pathCommands + '" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.25" stroke-linecap="round" stroke-linejoin="round"/>';
            trajectoryPath = '<path d="' + pathCommands + '" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2" stroke-linecap="round" stroke-linejoin="round"/>';
          }

          allPoints.forEach(function (pt, idx) {
            var px = sx(pt.gaDecimal);
            var py = sy(pt.cpr);
            var isAb = pt.centile < 5.0;
            var ptColor = isAb ? '#ff453a' : '#30d158';
            var isCur = !!pt.isCurrentPreview;
            var nodeLabel = (allPoints.length > 1 && activeMRN) ? ('第' + (idx + 1) + '次 (' + pt.weeks + 'w)') : ('本次實測 (' + pt.weeks + 'w)');

            trajectoryMarkers +=
              '<g class="trajectory-node">' +
                '<circle cx="' + px + '" cy="' + py + '" r="' + (isCur ? '8' : '6') + '" fill="' + ptColor + '" stroke="#ffffff" stroke-width="2"/>' +
                '<text x="' + px + '" y="' + (py - 12) + '" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">' +
                  nodeLabel +
                '</text>' +
              '</g>';
          });
        }

        var scrubberMarkup = '';
        if (typeof scrubGA === 'number' && scrubGA >= minX && scrubGA <= maxX) {
          var sX = sx(scrubGA);
          var sRef = getFMFCPRReference(scrubGA * 7);
          scrubberMarkup = '<line x1="' + sX + '" y1="' + padding.top + '" x2="' + sX + '" y2="' + (padding.top + plotH) + '" stroke="#38bdf8" stroke-width="1.5"/>' +
                           '<circle cx="' + sX + '" cy="' + sy(sRef.median) + '" r="4" fill="#38bdf8" stroke="#ffffff"/>' +
                           '<circle cx="' + sX + '" cy="' + sy(sRef.p5) + '" r="4" fill="#ff453a" stroke="#ffffff"/>';

          document.getElementById('ls-trend-text').innerHTML =
            '探針：<b>' + scrubGA.toFixed(1) + '週</b> ｜ 中位數: <b>' + sRef.median.toFixed(2) + '</b> ｜ 5th門檻: <b class="text-rose-400">' + sRef.p5.toFixed(2) + '</b>';
        } else {
          if (savedRecords.length >= 2 && activeMRN) {
            var first = savedRecords[0];
            var last = savedRecords[savedRecords.length - 1];
            var diffP = last.centile - first.centile;
            var isDrop = diffP < -15;
            document.getElementById('ls-trend-text').innerHTML =
              '📈 [' + activeMRN + '] 趨勢：' + first.weeks + 'w ➔ ' + last.weeks + 'w ' +
              (isDrop ? '<span class="text-rose-400 font-bold">(⚠️ 百分位自 ' + first.centile.toFixed(0) + '% 降至 ' + last.centile.toFixed(0) + '%)</span>'
                      : '<span class="text-emerald-400 font-bold">(百分位維持穩定)</span>');
          } else {
            document.getElementById('ls-trend-text').textContent = activeMRN ? ('病歷 [' + activeMRN + '] 單次檢測') : '未指定病歷號（單次實測點）';
          }
        }

        document.getElementById('ls-patient-summary').textContent =
          activeMRN ? ('病歷號: [' + activeMRN + '] · 累積 ' + savedRecords.length + ' 次測量') : '新病患 · 單次實測落點';
        document.getElementById('ls-status-dot').className =
          currentCalc.isAbnormal ? 'ls-dot-indicator dot-abnormal' : 'ls-dot-indicator dot-normal';

        container.innerHTML = '<svg id="interactive-svg" viewBox="0 0 ' + width + ' ' + height + '" class="ls-svg" preserveAspectRatio="xMidYMid meet">' +
          '<rect x="' + padding.left + '" y="' + padding.top + '" width="' + plotW + '" height="' + plotH + '" fill="#090d16" rx="6"/>' +
          gridX +
          gridY +
          '<path d="' + shadedBand + '" fill="#0284c7" opacity="0.25"/>' +
          '<path d="' + path95 + '" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>' +
          '<path d="' + path50 + '" fill="none" stroke="#38bdf8" stroke-width="2"/>' +
          '<path d="' + path5 + '" fill="none" stroke="#ff453a" stroke-width="2"/>' +
          trajectoryGlow +
          trajectoryPath +
          trajectoryMarkers +
          scrubberMarkup +
          '<text x="' + (padding.left + plotW / 2) + '" y="' + (height - 6) + '" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">懷孕週數 (Gestational Age, weeks)</text>' +
          '<text transform="rotate(-90)" x="' + (-(padding.top + plotH / 2)) + '" y="14" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">CPR 數值</text>' +
        '</svg>';

        var svgEl = document.getElementById('interactive-svg');
        if (svgEl) {
          function handlePointer(evt) {
            var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            var cRect = svgEl.getBoundingClientRect();
            var relX = (clientX - cRect.left) * (width / cRect.width);
            if (relX >= padding.left && relX <= padding.left + plotW) {
              renderLandscapeChart(invX(relX));
            }
          }
          svgEl.addEventListener('mousemove', handlePointer);
          svgEl.addEventListener('touchmove', handlePointer, { passive: true });
        }
      }

      function setMode(isLandscape) {
        if (isLandscape) {
          document.body.classList.remove('mode-portrait');
          document.body.classList.add('mode-landscape');
          setTimeout(function() { renderLandscapeChart(); }, 60);
        } else {
          document.body.classList.remove('mode-landscape');
          document.body.classList.add('mode-portrait');
        }
      }

      var inputSequence = ['input-patient-mrn', 'input-ga-weeks', 'input-ga-days', 'input-mca-pi', 'input-uma-pi'];
      var labels = {
        'input-patient-mrn': '病歷號',
        'input-ga-weeks': '懷孕週數 (週)',
        'input-ga-days': '懷孕週數 (天)',
        'input-mca-pi': 'MCA PI',
        'input-uma-pi': 'UmA PI'
      };

      function dismissKeyboard() {
        if (document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }
        var toolbar = document.getElementById('ios-kb-toolbar');
        if (toolbar) toolbar.classList.add('hidden');
      }

      function moveToNextInput() {
        var activeId = document.activeElement ? document.activeElement.id : null;
        var idx = inputSequence.indexOf(activeId);
        if (idx !== -1 && idx < inputSequence.length - 1) {
          var nextEl = document.getElementById(inputSequence[idx + 1]);
          if (nextEl) {
            nextEl.focus();
            if (nextEl.select) nextEl.select();
            return;
          }
        }
        dismissKeyboard();
      }

      function showKeyboardToolbar(inputId) {
        var toolbar = document.getElementById('ios-kb-toolbar');
        var labelEl = document.getElementById('kb-current-label');
        if (toolbar && labelEl) {
          labelEl.textContent = labels[inputId] || '輸入中...';
          toolbar.classList.remove('hidden');
        }
      }

      function attachEvents() {
        inputSequence.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) {
            el.addEventListener('input', recalculate);
            el.addEventListener('change', recalculate);
            el.addEventListener('focus', function () { showKeyboardToolbar(id); });
            el.addEventListener('keydown', function (e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                moveToNextInput();
              }
            });
          }
        });

        document.getElementById('btn-kb-done')?.addEventListener('click', function (e) {
          e.preventDefault();
          dismissKeyboard();
        });

        document.getElementById('btn-kb-next')?.addEventListener('click', function (e) {
          e.preventDefault();
          moveToNextInput();
        });

        document.addEventListener('click', function (e) {
          if (!e.target.closest('input, select, button, .ios-kb-toolbar')) {
            dismissKeyboard();
          }
        });
        document.addEventListener('touchstart', function (e) {
          if (!e.target.closest('input, select, button, .ios-kb-toolbar')) {
            dismissKeyboard();
          }
        }, { passive: true });

        // ➕ 新病人按鈕
        document.getElementById('btn-new-patient')?.addEventListener('click', function () {
          startNewPatient();
        });

        // 近期病患選單切換 (明確載入特定病歷)
        document.getElementById('select-recent-patients')?.addEventListener('change', function (e) {
          if (e.target.value) {
            document.getElementById('input-patient-mrn').value = e.target.value;
            recalculate();
          }
        });

        // 儲存本次量測按鈕
        document.getElementById('btn-save-measurement')?.addEventListener('click', function () {
          dismissKeyboard();
          var mrnField = document.getElementById('input-patient-mrn');
          var enteredMRN = mrnField ? mrnField.value.trim().toUpperCase() : '';
          if (!enteredMRN) {
            enteredMRN = prompt('請輸入此病患之病歷號 (MRN)：');
            if (!enteredMRN || !enteredMRN.trim()) {
              alert('未輸入病歷號，未儲存紀錄。');
              return;
            }
            enteredMRN = enteredMRN.trim().toUpperCase();
            if (mrnField) mrnField.value = enteredMRN;
          }

          var timeStr = updateAutoTime();
          var updated = DB.save(enteredMRN, {
            weeks: currentCalc.weeks,
            days: currentCalc.days,
            gaDecimal: currentCalc.gaDecimal,
            mcaPI: currentCalc.mcaPI,
            umaPI: currentCalc.umaPI,
            cpr: currentCalc.cpr,
            centile: currentCalc.centile,
            isAbnormal: currentCalc.isAbnormal,
            timestamp: timeStr
          });

          alert('✓ 已成功儲存至病歷號 [' + enteredMRN + ']！\n該病患當前累積 ' + updated.length + ' 次追蹤測量。');
          recalculate();
          renderLandscapeChart();
        });

        document.getElementById('btn-toggle-to-chart')?.addEventListener('click', function() {
          dismissKeyboard();
          setMode(true);
        });
        document.getElementById('btn-back-to-input')?.addEventListener('click', function() {
          setMode(false);
        });

        window.addEventListener('resize', function () {
          var isLandscape = window.innerWidth > window.innerHeight;
          setMode(isLandscape);
        });

        updateAutoTime();
        recalculate();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', attachEvents);
      } else {
        attachEvents();
      }
    })();
  </script>
</body>
</html>
