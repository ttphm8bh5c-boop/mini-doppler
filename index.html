<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CPR 計算器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="iphone-container">
    <!-- iOS Navigation Bar -->
    <header class="ios-nav-bar">
      <h1 class="nav-title">CPR 計算器</h1>
    </header>

    <!-- Main Content Stream (iOS Inset Grouped Style) -->
    <main class="ios-main-content">

      <!-- 1. 頂部：CPR 結果大卡片 (Result Card) -->
      <section class="ios-card result-hero-card">
        <div class="hero-cpr-header">
          <span class="hero-label">CPR 數值</span>
          <span class="hero-label">百分位數</span>
        </div>

        <div class="hero-numbers-row">
          <div class="hero-cpr-val" id="display-cpr-num">2.11</div>
          <div class="hero-centile-val" id="display-cpr-centile">78.8%</div>
        </div>

        <div class="hero-footer-row">
          <span id="display-cpr-status-badge" class="ios-badge badge-normal">
            ✓ 正常
          </span>
          <span class="hero-hint">FMF 2019 標準</span>
        </div>
      </section>

      <!-- 2. 中間：3 個單手輸入格 (iOS Inset Grouped List) -->
      <section class="ios-card inputs-card">
        <!-- 懷孕週數 -->
        <div class="ios-list-row">
          <label class="row-label">懷孕週數</label>
          <div class="ga-input-cluster">
            <input type="number" id="input-ga-weeks" value="28" min="20" max="42" step="1" inputmode="numeric" class="ga-num-input" />
            <span class="ga-unit">週</span>
            <span class="ga-plus">+</span>
            <input type="number" id="input-ga-days" value="4" min="0" max="6" step="1" inputmode="numeric" class="ga-num-input" />
            <span class="ga-unit">天</span>
          </div>
        </div>

        <!-- MCA PI -->
        <div class="ios-list-row">
          <label class="row-label" for="input-mca-pi">MCA PI</label>
          <input type="number" id="input-mca-pi" value="1.79" step="0.01" min="0.1" max="4.0" inputmode="decimal" class="row-single-input" placeholder="例如 1.79" />
        </div>

        <!-- UmA PI -->
        <div class="ios-list-row last-row">
          <label class="row-label" for="input-uma-pi">UmA PI</label>
          <input type="number" id="input-uma-pi" value="0.85" step="0.01" min="0.1" max="4.0" inputmode="decimal" class="row-single-input" placeholder="例如 0.85" />
        </div>
      </section>

      <!-- 3. 底部：CPR 參考曲線圖 (Chart Card) -->
      <section class="ios-card chart-card">
        <div class="chart-header-row">
          <span class="chart-title">CPR 懷孕週數曲線 (20–42 週)</span>
        </div>
        <div id="chart-mount" class="chart-mount-box"></div>
      </section>

    </main>
  </div>

  <script>
    (function () {
      function normalCDF(z) {
        var t = 1.0 / (1.0 + 0.3275911 * Math.abs(z));
        var poly = ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t;
        var erf = (z >= 0 ? 1 : -1) * (1.0 - poly * Math.exp(-z * z));
        return 0.5 * (1.0 + erf);
      }

      function getFMFCPRReference(gaDays) {
        var logMedian = -0.1820 + (0.00392 * gaDays) - (0.00000854 * gaDays * gaDays);
        var median = Math.pow(10, logMedian);
        var sd = 0.0952 - (0.000251 * gaDays) + (0.00000085 * gaDays * gaDays);
        var z90 = 1.644853;
        var p5 = Math.pow(10, logMedian - (z90 * sd));
        var p95 = Math.pow(10, logMedian + (z90 * sd));
        return { median: median, sd: sd, p5: p5, p95: p95, logMedian: logMedian };
      }

      function renderChart(container, patientGA, patientCPR, isAbnormal) {
        var width = 350;
        var height = 210;
        var padding = { top: 16, right: 18, bottom: 28, left: 36 };
        var plotW = width - padding.left - padding.right;
        var plotH = height - padding.top - padding.bottom;

        var minX = 20;
        var maxX = 42;
        var minY = 0.4;
        var maxY = 3.0;

        if (patientCPR !== null && patientCPR > maxY) {
          maxY = Math.ceil(patientCPR * 1.15 * 10) / 10;
        }

        function sx(x) { return padding.left + ((x - minX) / (maxX - minX)) * plotW; }
        function sy(y) { return padding.top + plotH - ((y - minY) / (maxY - minY)) * plotH; }

        var points = [];
        for (var ga = 20.0; ga <= 42.0; ga += 1.0) {
          var ref = getFMFCPRReference(ga * 7);
          points.push({ ga: ga, p5: ref.p5, p50: ref.median, p95: ref.p95 });
        }

        var path50 = points.map(function (d, i) { return (i === 0 ? 'M' : 'L') + ' ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p50).toFixed(1); }).join(' ');
        var path95 = points.map(function (d, i) { return (i === 0 ? 'M' : 'L') + ' ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p95).toFixed(1); }).join(' ');
        var path5 = points.map(function (d, i) { return (i === 0 ? 'M' : 'L') + ' ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p5).toFixed(1); }).join(' ');

        var forward95 = path95;
        var backward5 = points.slice().reverse().map(function (d) { return 'L ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p5).toFixed(1); }).join(' ');
        var shadedBand = forward95 + ' ' + backward5 + ' Z';

        var gridX = '';
        var weekTicks = [20, 24, 28, 32, 36, 40];
        for (var i = 0; i < weekTicks.length; i++) {
          var w = weekTicks[i];
          var x = sx(w);
          gridX += '<line x1="' + x + '" y1="' + padding.top + '" x2="' + x + '" y2="' + (padding.top + plotH) + '" stroke="#e5e5ea" stroke-width="1" stroke-dasharray="2,2"/>' +
                   '<text x="' + x + '" y="' + (padding.top + plotH + 15) + '" font-size="10" fill="#8e8e93" text-anchor="middle">' + w + 'w</text>';
        }

        var gridY = '';
        var yTicks = [1.0, 2.0];
        for (var j = 0; j < yTicks.length; j++) {
          var yVal = yTicks[j];
          var y = sy(yVal);
          gridY += '<line x1="' + padding.left + '" y1="' + y + '" x2="' + (padding.left + plotW) + '" y2="' + y + '" stroke="#e5e5ea" stroke-width="1" stroke-dasharray="2,2"/>' +
                   '<text x="' + (padding.left - 6) + '" y="' + (y + 3) + '" font-size="10" fill="#8e8e93" text-anchor="end">' + yVal.toFixed(1) + '</text>';
        }

        var patientMarker = '';
        if (patientGA !== null && patientCPR !== null && patientGA >= minX && patientGA <= maxX) {
          var px = sx(patientGA);
          var py = sy(patientCPR);
          var markerColor = isAbnormal ? '#ff3b30' : '#34c759';

          patientMarker = '<line x1="' + px + '" y1="' + padding.top + '" x2="' + px + '" y2="' + (padding.top + plotH) + '" stroke="' + markerColor + '" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>' +
                          '<circle cx="' + px + '" cy="' + py + '" r="8" fill="' + markerColor + '" opacity="0.25"/>' +
                          '<circle cx="' + px + '" cy="' + py + '" r="5" fill="' + markerColor + '" stroke="#ffffff" stroke-width="2"/>';
        }

        container.innerHTML = '<svg viewBox="0 0 ' + width + ' ' + height + '" class="ios-svg" preserveAspectRatio="xMidYMid meet">' +
            '<rect x="' + padding.left + '" y="' + padding.top + '" width="' + plotW + '" height="' + plotH + '" fill="#f9f9fb" rx="4"/>' +
            gridX +
            gridY +
            '<path d="' + shadedBand + '" fill="#e1f0ff" opacity="0.8"/>' +
            '<path d="' + path95 + '" fill="none" stroke="#8e8e93" stroke-width="1.5" stroke-dasharray="3,3"/>' +
            '<path d="' + path50 + '" fill="none" stroke="#007aff" stroke-width="2"/>' +
            '<path d="' + path5 + '" fill="none" stroke="#ff3b30" stroke-width="1.8"/>' +
            patientMarker +
          '</svg>' +
          '<div class="ios-legend-row">' +
            '<span class="legend-item"><span class="swatch-50"></span> 50th (中位數)</span>' +
            '<span class="legend-item"><span class="swatch-5"></span> 5th (異常線)</span>' +
            (patientCPR !== null ? '<span class="legend-item"><span class="swatch-dot ' + (isAbnormal ? 'dot-abnormal' : 'dot-normal') + '"></span> 實測點</span>' : '') +
          '</div>';
      }

      function calculate() {
        var w = parseInt(document.getElementById('input-ga-weeks').value, 10);
        var d = parseInt(document.getElementById('input-ga-days').value, 10);
        var mca = parseFloat(document.getElementById('input-mca-pi').value);
        var uma = parseFloat(document.getElementById('input-uma-pi').value);

        var cprDisplay = document.getElementById('display-cpr-num');
        var centileDisplay = document.getElementById('display-cpr-centile');
        var badgeDisplay = document.getElementById('display-cpr-status-badge');
        var chartMount = document.getElementById('chart-mount');

        if (isNaN(w) || w < 20 || w > 42) w = 28;
        if (isNaN(d) || d < 0 || d > 6) d = 0;
        if (isNaN(mca) || mca <= 0) mca = 1.0;
        if (isNaN(uma) || uma <= 0) uma = 1.0;

        var gaDays = (w * 7) + d;
        var gaDec = w + (d / 7);
        var cpr = mca / uma;

        cprDisplay.textContent = cpr.toFixed(2);

        var ref = getFMFCPRReference(gaDays);
        var z = (Math.log10(cpr) - ref.logMedian) / ref.sd;
        var centile = normalCDF(z) * 100.0;

        var pText = centile < 1.0 ? '< 1%' : (centile > 99.0 ? '> 99%' : centile.toFixed(1) + '%');
        centileDisplay.textContent = pText;

        var isAbnormal = centile < 5.0;
        if (isAbnormal) {
          badgeDisplay.className = 'ios-badge badge-abnormal';
          badgeDisplay.textContent = '⚠️ 異常 (< 5%)';
        } else {
          badgeDisplay.className = 'ios-badge badge-normal';
          badgeDisplay.textContent = '✓ 正常';
        }

        renderChart(chartMount, gaDec, cpr, isAbnormal);
      }

      function attach() {
        var inputs = ['input-ga-weeks', 'input-ga-days', 'input-mca-pi', 'input-uma-pi'];
        inputs.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) {
            el.addEventListener('input', calculate);
            el.addEventListener('change', calculate);
          }
        });
        calculate();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', attach);
      } else {
        attach();
      }
    })();
  </script>
</body>
</html>
