<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CPR 計算器 (方案三：直屏輸入 + 橫屏大圖)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="mode-portrait">

  <!-- =========================================================================
       模式一：直屏模式 (Portrait Mode) - 專注於手指極速輸入與大字結果
       ========================================================================= -->
  <div id="container-portrait" class="view-container portrait-view">
    <!-- iOS 頂部導航列 -->
    <header class="ios-nav-bar">
      <div class="nav-content">
        <h1 class="nav-title">CPR 計算器</h1>
        <button type="button" id="btn-toggle-to-chart" class="nav-chart-btn" title="切換橫屏全幅圖表">
          📊 全螢幕圖表
        </button>
      </div>
    </header>

    <!-- 直向主體內容區 (充足留白，虛擬鍵盤彈起時絕不遮擋輸入與結果) -->
    <main class="portrait-body">
      <!-- 1. CPR 核心結果大卡片 -->
      <section class="ios-card result-hero-card">
        <div class="hero-cpr-header">
          <span class="hero-label">CPR 數值</span>
          <span class="hero-label">百分位數</span>
        </div>

        <div class="hero-numbers-row">
          <div class="hero-cpr-val" id="display-cpr-num">2.11</div>
          <div class="hero-centile-val" id="display-cpr-centile">78.8%</div>
        </div>

        <div class="hero-footer-row">
          <span id="display-cpr-status-badge" class="ios-badge badge-normal">
            ✓ 正常 (≥ 第 5 百分位)
          </span>
          <span class="hero-hint">FMF 2019 參考標準</span>
        </div>
      </section>

      <!-- 2. 3 個單手手指輸入格 (44pt+ 觸控高度，直向居中) -->
      <section class="ios-card inputs-card">
        <!-- 懷孕週數 -->
        <div class="ios-list-row">
          <label class="row-label">懷孕週數</label>
          <div class="ga-input-cluster">
            <input type="number" id="input-ga-weeks" value="28" min="20" max="42" step="1" inputmode="numeric" class="ga-num-input" />
            <span class="ga-unit">週</span>
            <span class="ga-plus">+</span>
            <input type="number" id="input-ga-days" value="4" min="0" max="6" step="1" inputmode="numeric" class="ga-num-input" />
            <span class="ga-unit">天</span>
          </div>
        </div>

        <!-- MCA PI -->
        <div class="ios-list-row">
          <label class="row-label" for="input-mca-pi">MCA PI</label>
          <input type="number" id="input-mca-pi" value="1.79" step="0.01" min="0.1" max="4.0" inputmode="decimal" class="row-single-input" placeholder="例如 1.79" />
        </div>

        <!-- UmA PI -->
        <div class="ios-list-row last-row">
          <label class="row-label" for="input-uma-pi">UmA PI</label>
          <input type="number" id="input-uma-pi" value="0.85" step="0.01" min="0.1" max="4.0" inputmode="decimal" class="row-single-input" placeholder="例如 0.85" />
        </div>
      </section>

      <!-- 3. 機台橫屏提示卡片 (點擊或旋轉手機即進入大圖表) -->
      <section class="landscape-tip-card" id="card-tip-landscape">
        <div class="tip-icon">🔄</div>
        <div class="tip-text-box">
          <div class="tip-title">手機轉橫即可查看全螢幕動態大圖表</div>
          <div class="tip-desc">全幅展示 20–42 週參考曲線，支援手指滑動探查每一週數值。</div>
        </div>
        <button type="button" id="btn-action-open-chart" class="tip-open-btn">
          開啟圖表 ↗
        </button>
      </section>
    </main>
  </div>


  <!-- =========================================================================
       模式二：橫屏模式 (Landscape Mode) - 全螢幕醫療機台級大圖表
       ========================================================================= -->
  <div id="container-landscape" class="view-container landscape-view">
    <!-- 橫屏頂部精簡控制列 -->
    <header class="landscape-header">
      <div class="ls-patient-badge">
        <span class="ls-dot-indicator" id="ls-status-dot"></span>
        <span id="ls-patient-summary">28.57週 · CPR 2.11 (78.8% 正常)</span>
      </div>

      <div class="ls-scrub-readout" id="ls-scrub-readout">
        觸碰或滑動圖表探查參考數值
      </div>

      <button type="button" id="btn-back-to-input" class="ls-back-btn">
        ↺ 返回輸入
      </button>
    </header>

    <!-- 橫屏全螢幕 SVG 畫布 -->
    <div id="landscape-chart-mount" class="landscape-chart-container"></div>
  </div>


  <!-- 內建純原生互動演算法腳本 (免除 WebKit 檔案協定安全限制，毫秒級連動) -->
  <script>
    (function () {
      // 狀態管理
      var state = {
        weeks: 28,
        days: 4,
        mca: 1.79,
        uma: 0.85,
        gaDecimal: 28.57,
        cpr: 2.11,
        centile: 78.8,
        isAbnormal: false,
        isForceLandscape: false
      };

      function normalCDF(z) {
        var t = 1.0 / (1.0 + 0.3275911 * Math.abs(z));
        var poly = ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t;
        var erf = (z >= 0 ? 1 : -1) * (1.0 - poly * Math.exp(-z * z));
        return 0.5 * (1.0 + erf);
      }

      function getFMFCPRReference(gaDays) {
        var logMedian = -0.1820 + (0.00392 * gaDays) - (0.00000854 * gaDays * gaDays);
        var median = Math.pow(10, logMedian);
        var sd = 0.0952 - (0.000251 * gaDays) + (0.00000085 * gaDays * gaDays);
        var z90 = 1.644853;
        var p5 = Math.pow(10, logMedian - (z90 * sd));
        var p95 = Math.pow(10, logMedian + (z90 * sd));
        return { median: median, sd: sd, p5: p5, p95: p95, logMedian: logMedian };
      }

      function recalculate() {
        var w = parseInt(document.getElementById('input-ga-weeks').value, 10);
        var d = parseInt(document.getElementById('input-ga-days').value, 10);
        var mca = parseFloat(document.getElementById('input-mca-pi').value);
        var uma = parseFloat(document.getElementById('input-uma-pi').value);

        if (isNaN(w) || w < 20 || w > 42) w = 28;
        if (isNaN(d) || d < 0 || d > 6) d = 0;
        if (isNaN(mca) || mca <= 0) mca = 1.0;
        if (isNaN(uma) || uma <= 0) uma = 1.0;

        var gaDays = (w * 7) + d;
        var gaDec = w + (d / 7);
        var cpr = mca / uma;

        var ref = getFMFCPRReference(gaDays);
        var z = (Math.log10(cpr) - ref.logMedian) / ref.sd;
        var centile = normalCDF(z) * 100.0;
        var isAbnormal = centile < 5.0;

        state.weeks = w;
        state.days = d;
        state.mca = mca;
        state.uma = uma;
        state.gaDecimal = gaDec;
        state.cpr = cpr;
        state.centile = centile;
        state.isAbnormal = isAbnormal;

        // 更新直屏介面
        document.getElementById('display-cpr-num').textContent = cpr.toFixed(2);
        var pText = centile < 1.0 ? '< 1%' : (centile > 99.0 ? '> 99%' : centile.toFixed(1) + '%');
        document.getElementById('display-cpr-centile').textContent = pText;

        var badge = document.getElementById('display-cpr-status-badge');
        if (isAbnormal) {
          badge.className = 'ios-badge badge-abnormal';
          badge.textContent = '⚠️ 異常 (< 第 5 百分位)';
        } else {
          badge.className = 'ios-badge badge-normal';
          badge.textContent = '✓ 正常 (≥ 第 5 百分位)';
        }

        // 更新橫屏頂部資訊
        var summary = document.getElementById('ls-patient-summary');
        var dot = document.getElementById('ls-status-dot');
        summary.textContent = gaDec.toFixed(1) + '週 · CPR ' + cpr.toFixed(2) + ' (' + pText + (isAbnormal ? ' 異常' : ' 正常') + ')';
        dot.className = isAbnormal ? 'ls-dot-indicator dot-abnormal' : 'ls-dot-indicator dot-normal';

        // 重新繪製橫屏全螢幕圖表
        renderLandscapeChart();
      }

      // 繪製橫屏全螢幕圖表 (支援手指觸摸探查)
      function renderLandscapeChart(scrubGA) {
        var container = document.getElementById('landscape-chart-mount');
        if (!container) return;

        var rect = container.getBoundingClientRect();
        var width = Math.max(rect.width || 700, 600);
        var height = Math.max(rect.height || 360, 320);

        var padding = { top: 25, right: 35, bottom: 35, left: 45 };
        var plotW = width - padding.left - padding.right;
        var plotH = height - padding.top - padding.bottom;

        var minX = 20;
        var maxX = 42;
        var minY = 0.4;
        var maxY = 3.0;

        if (state.cpr > maxY) {
          maxY = Math.ceil(state.cpr * 1.15 * 10) / 10;
        }

        function sx(x) { return padding.left + ((x - minX) / (maxX - minX)) * plotW; }
        function sy(y) { return padding.top + plotH - ((y - minY) / (maxY - minY)) * plotH; }
        function invX(px) { return minX + ((px - padding.left) / plotW) * (maxX - minX); }

        var points = [];
        for (var ga = 20.0; ga <= 42.0; ga += 0.5) {
          var ref = getFMFCPRReference(ga * 7);
          points.push({ ga: ga, p5: ref.p5, p50: ref.median, p95: ref.p95 });
        }

        var path50 = points.map(function (d, i) { return (i === 0 ? 'M' : 'L') + ' ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p50).toFixed(1); }).join(' ');
        var path95 = points.map(function (d, i) { return (i === 0 ? 'M' : 'L') + ' ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p95).toFixed(1); }).join(' ');
        var path5 = points.map(function (d, i) { return (i === 0 ? 'M' : 'L') + ' ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p5).toFixed(1); }).join(' ');

        var forward95 = path95;
        var backward5 = points.slice().reverse().map(function (d) { return 'L ' + sx(d.ga).toFixed(1) + ' ' + sy(d.p5).toFixed(1); }).join(' ');
        var shadedBand = forward95 + ' ' + backward5 + ' Z';

        // 垂直週數刻度線
        var gridX = '';
        for (var w = 20; w <= 42; w += 2) {
          var gx = sx(w);
          gridX += '<line x1="' + gx + '" y1="' + padding.top + '" x2="' + gx + '" y2="' + (padding.top + plotH) + '" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>' +
                   '<text x="' + gx + '" y="' + (padding.top + plotH + 18) + '" font-size="11" fill="#94a3b8" text-anchor="middle">' + w + 'w</text>';
        }

        // 水平 CPR 刻度線
        var gridY = '';
        for (var yVal = 0.5; yVal <= maxY + 0.001; yVal += 0.5) {
          var gy = sy(yVal);
          gridY += '<line x1="' + padding.left + '" y1="' + gy + '" x2="' + (padding.left + plotW) + '" y2="' + gy + '" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>' +
                   '<text x="' + (padding.left - 8) + '" y="' + (gy + 4) + '" font-size="11" fill="#94a3b8" text-anchor="end">' + yVal.toFixed(1) + '</text>';
        }

        // 病患實測落點 (顯眼標記)
        var patientMarker = '';
        if (state.gaDecimal >= minX && state.gaDecimal <= maxX) {
          var pX = sx(state.gaDecimal);
          var pY = sy(state.cpr);
          var pColor = state.isAbnormal ? '#ff3b30' : '#34c759';

          patientMarker = '<line x1="' + pX + '" y1="' + padding.top + '" x2="' + pX + '" y2="' + (padding.top + plotH) + '" stroke="' + pColor + '" stroke-width="1.5" stroke-dasharray="3,3"/>' +
                          '<circle cx="' + pX + '" cy="' + pY + '" r="12" fill="' + pColor + '" opacity="0.3"/>' +
                          '<circle cx="' + pX + '" cy="' + pY + '" r="6" fill="' + pColor + '" stroke="#ffffff" stroke-width="2"/>' +
                          '<g transform="translate(' + (pX > plotW / 2 + padding.left ? pX - 110 : pX + 12) + ', ' + (pY < 60 ? pY + 18 : pY - 18) + ')">' +
                            '<rect width="100" height="24" rx="4" fill="#0f172a" opacity="0.9" stroke="#334155"/>' +
                            '<text x="50" y="16" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">實測: CPR ' + state.cpr.toFixed(2) + '</text>' +
                          '</g>';
        }

        // 手指滑動探查游標 (Interactive Scrubber)
        var scrubberMarkup = '';
        if (typeof scrubGA === 'number' && scrubGA >= minX && scrubGA <= maxX) {
          var sX = sx(scrubGA);
          var sRef = getFMFCPRReference(scrubGA * 7);
          scrubberMarkup = '<line x1="' + sX + '" y1="' + padding.top + '" x2="' + sX + '" y2="' + (padding.top + plotH) + '" stroke="#38bdf8" stroke-width="2"/>' +
                           '<circle cx="' + sX + '" cy="' + sy(sRef.median) + '" r="4" fill="#38bdf8" stroke="#ffffff"/>' +
                           '<circle cx="' + sX + '" cy="' + sy(sRef.p5) + '" r="4" fill="#ff453a" stroke="#ffffff"/>';

          // 更新頂部探查數值字串
          document.getElementById('ls-scrub-readout').innerHTML =
            '探針位置：<b class="text-sky-400">' + scrubGA.toFixed(1) + ' 週</b> ｜ 中位數: <b>' + sRef.median.toFixed(2) + '</b> ｜ 第 5 百分位(門檻): <b class="text-rose-400">' + sRef.p5.toFixed(2) + '</b>';
        }

        container.innerHTML = '<svg id="interactive-svg" viewBox="0 0 ' + width + ' ' + height + '" class="ls-svg" preserveAspectRatio="xMidYMid meet">' +
          '<rect x="' + padding.left + '" y="' + padding.top + '" width="' + plotW + '" height="' + plotH + '" fill="#090d16" rx="6"/>' +
          gridX +
          gridY +
          '<path d="' + shadedBand + '" fill="#0284c7" opacity="0.25"/>' +
          '<path d="' + path95 + '" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>' +
          '<path d="' + path50 + '" fill="none" stroke="#38bdf8" stroke-width="2.5"/>' +
          '<path d="' + path5 + '" fill="none" stroke="#ff453a" stroke-width="2"/>' +
          '<text x="' + scaleEnd(scaleX, 41.5) + '" y="' + (sy(points[points.length-1].p50) - 6) + '" font-size="10" fill="#38bdf8" font-weight="600">50th 中位數</text>' +
          '<text x="' + scaleEnd(scaleX, 41.5) + '" y="' + (sy(points[points.length-1].p5) + 12) + '" font-size="10" fill="#ff453a" font-weight="600">5th 異常線</text>' +
          patientMarker +
          scrubberMarkup +
          '<text x="' + (padding.left + plotW / 2) + '" y="' + (height - 6) + '" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">懷孕週數 (Gestational Age, weeks)</text>' +
          '<text transform="rotate(-90)" x="' + (-(padding.top + plotH / 2)) + '" y="14" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">CPR 數值</text>' +
        '</svg>';

        function scaleEnd(fn, val) { return fn(val); }
        function scaleX(v) { return sx(v); }

        // 綁定手指觸碰與滑鼠滑動探針事件
        var svgEl = document.getElementById('interactive-svg');
        if (svgEl) {
          function handlePointer(evt) {
            var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            var cRect = svgEl.getBoundingClientRect();
            var relX = (clientX - cRect.left) * (width / cRect.width);
            if (relX >= padding.left && relX <= padding.left + plotW) {
              var targetGA = invX(relX);
              renderLandscapeChart(targetGA);
            }
          }

          svgEl.addEventListener('mousemove', handlePointer);
          svgEl.addEventListener('touchmove', handlePointer, { passive: true });
        }
      }

      // 視窗方向切換處理
      function setMode(isLandscape) {
        state.isForceLandscape = isLandscape;
        if (isLandscape) {
          document.body.classList.remove('mode-portrait');
          document.body.classList.add('mode-landscape');
          setTimeout(function() { renderLandscapeChart(); }, 50);
        } else {
          document.body.classList.remove('mode-landscape');
          document.body.classList.add('mode-portrait');
        }
      }

      function init() {
        var inputs = ['input-ga-weeks', 'input-ga-days', 'input-mca-pi', 'input-uma-pi'];
        inputs.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) {
            el.addEventListener('input', recalculate);
            el.addEventListener('change', recalculate);
          }
        });

        // 切換橫屏 / 直屏按鈕
        document.getElementById('btn-toggle-to-chart')?.addEventListener('click', function() { setMode(true); });
        document.getElementById('btn-action-open-chart')?.addEventListener('click', function() { setMode(true); });
        document.getElementById('btn-back-to-input')?.addEventListener('click', function() { setMode(false); });

        // 偵測螢幕旋轉 (實機 iPhone 自動轉向切換)
        window.addEventListener('resize', function () {
          var isLandscape = window.innerWidth > window.innerHeight;
          if (isLandscape) {
            setMode(true);
          } else if (!state.isForceLandscape) {
            setMode(false);
          }
        });

        // 初始計算
        recalculate();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
