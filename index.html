<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>胎兒多普勒 CPR 計算器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="ios-app-body">

  <div class="app-container">
    <!-- 頂部標題列 (iOS Navigation Bar) -->
    <header class="ios-nav-header">
      <h1 class="nav-title">胎兒 CPR 計算器</h1>
      <span class="nav-subtitle">Fetal Cerebroplacental Ratio</span>
    </header>

    <!-- 1. 核心結果雙輸出卡片 (CPR 數值 ＆ 百分位數 %) -->
    <section class="result-card">
      <div class="result-col">
        <span class="result-label">CPR 數值</span>
        <div class="result-value" id="res-cpr-val">2.03</div>
        <span class="result-formula">MCA PI / UmA PI</span>
      </div>

      <div class="result-divider"></div>

      <div class="result-col">
        <span class="result-label">百分位數 (參考值)</span>
        <div class="result-value" id="res-centile-val">72.8%</div>
        <span id="res-status-badge" class="status-badge badge-normal">常態區間 (≥ 5th)</span>
      </div>
    </section>

    <!-- 2. 極簡 3 欄輸入卡片 -->
    <main class="inputs-container">

      <!-- 輸入項一：懷孕週數 (週 + 天) -->
      <div class="input-card">
        <div class="input-card-header">
          <label class="input-title">懷孕週數 (Gestational Age)</label>
          <span id="ga-feedback" class="feedback-text"></span>
        </div>
        
        <div class="ga-stepper-row">
          <!-- 週數控制 -->
          <div class="ga-subgroup">
            <button type="button" class="btn-step" id="btn-weeks-minus" aria-label="週數減一">－</button>
            <div class="input-unit-wrap">
              <input type="number" id="input-weeks" value="28" min="20" max="42" step="1" inputmode="numeric" class="num-input" />
              <span class="unit-text">週</span>
            </div>
            <button type="button" class="btn-step" id="btn-weeks-plus" aria-label="週數加一">＋</button>
          </div>

          <span class="ga-sep">＋</span>

          <!-- 天數控制 -->
          <div class="ga-subgroup ga-days-group">
            <button type="button" class="btn-step" id="btn-days-minus" aria-label="天數減一">－</button>
            <div class="input-unit-wrap">
              <input type="number" id="input-days" value="4" min="0" max="6" step="1" inputmode="numeric" class="num-input" />
              <span class="unit-text">天</span>
            </div>
            <button type="button" class="btn-step" id="btn-days-plus" aria-label="天數加一">＋</button>
          </div>
        </div>
      </div>

      <!-- 輸入項二：MCA PI (大腦中動脈搏動指數) -->
      <div class="input-card">
        <div class="input-card-header">
          <label class="input-title" for="input-mca">大腦中動脈 MCA PI</label>
          <span id="mca-feedback" class="feedback-text"></span>
        </div>
        
        <div class="stepper-row">
          <button type="button" class="btn-step" id="btn-mca-minus" aria-label="MCA PI 減 0.05">－</button>
          <input type="number" id="input-mca" value="1.79" min="0.1" max="5.0" step="0.01" inputmode="decimal" class="num-input-large" placeholder="例如 1.79" />
          <button type="button" class="btn-step" id="btn-mca-plus" aria-label="MCA PI 加 0.05">＋</button>
        </div>
      </div>

      <!-- 輸入項三：UmA PI (臍動脈搏動指數) -->
      <div class="input-card">
        <div class="input-card-header">
          <label class="input-title" for="input-uma">臍動脈 UmA PI</label>
          <span id="uma-feedback" class="feedback-text"></span>
        </div>
        
        <div class="stepper-row">
          <button type="button" class="btn-step" id="btn-uma-minus" aria-label="UmA PI 減 0.05">－</button>
          <input type="number" id="input-uma" value="0.88" min="0.1" max="5.0" step="0.01" inputmode="decimal" class="num-input-large" placeholder="例如 0.88" />
          <button type="button" class="btn-step" id="btn-uma-plus" aria-label="UmA PI 加 0.05">＋</button>
        </div>
      </div>

    </main>

    <!-- 臨床指引免責與文獻依據 -->
    <footer class="app-footer">
      <p class="citation-text">參考文獻：Fetal Medicine Foundation 2019 (Ciobanu et al., UOG 2019)</p>
      <p class="disclaimer-text">⚠️ 依據 ISUOG 2020 指引：本工具百分位數僅供產科臨床參考，請結合胎兒生長指標綜合評估。</p>
    </footer>
  </div>

  <script src="app.bundle.js"></script>
</body>
</html>
